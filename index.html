<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema Markup Validator</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f3e8ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe',
                400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7e22ce',
                800: '#6b21a8', 900: '#581c87',
              }
            }
          },
        },
      }
    </script>
    <style>
      body { background-color: #ffffff; }
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    
    <!-- API Key Configuration -->
    <script>
      window.process = {
        env: {
          // --- VUL HIER JE API KEY IN ---
          // Zorg ervoor dat je in Google Cloud Console een HTTP Referrer restrictie instelt op je domein!
          API_KEY: '' 
        }
      };
    </script>

    <!-- Import Map -->
    <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Layout, Sparkles, AlertCircle, Loader2, CheckCircle, AlertTriangle, Code, FileJson, Copy, Check } from 'lucide-react';
        import { PieChart, Pie, Cell, ResponsiveContainer } from 'recharts';
        import { GoogleGenAI, Type } from "@google/genai";

        // --- Enums & Constants ---
        const ValidationSeverity = {
            Error: 'error',
            Warning: 'warning',
            Info: 'info',
        };

        const AnalysisStatus = {
            Idle: 'idle',
            Loading: 'loading',
            Success: 'success',
            Error: 'error',
        };

        // --- Service Logic ---
        const getSchemaAnalysis = async (input) => {
            const apiKey = window.process?.env?.API_KEY;
            if (!apiKey) throw new Error("API Key niet gevonden. Configureer dit in de HTML broncode.");

            const ai = new GoogleGenAI({ apiKey });

            const responseSchema = {
                type: Type.OBJECT,
                properties: {
                    summary: { type: Type.STRING, description: "Korte Nederlandse samenvatting." },
                    detectedTypes: { type: Type.ARRAY, items: { type: Type.STRING } },
                    entities: {
                        type: Type.ARRAY,
                        items: {
                            type: Type.OBJECT,
                            properties: {
                                type: { type: Type.STRING },
                                propertiesFound: { type: Type.ARRAY, items: { type: Type.STRING } },
                                missingRequired: { type: Type.ARRAY, items: { type: Type.STRING } },
                                missingRecommended: { type: Type.ARRAY, items: { type: Type.STRING } },
                            },
                            required: ["type", "propertiesFound", "missingRequired", "missingRecommended"],
                        }
                    },
                    issues: {
                        type: Type.ARRAY,
                        items: {
                            type: Type.OBJECT,
                            properties: {
                                severity: { type: Type.STRING, enum: ["error", "warning", "info"] },
                                type: { type: Type.STRING, enum: ["syntax", "schema", "inconsistency"] },
                                message: { type: Type.STRING },
                                entity: { type: Type.STRING },
                                property: { type: Type.STRING },
                            },
                            required: ["severity", "type", "message"],
                        }
                    },
                    healthScore: { type: Type.NUMBER },
                    correctedJsonLdString: { type: Type.STRING }
                },
                required: ["summary", "detectedTypes", "entities", "issues", "healthScore", "correctedJsonLdString"],
            };

            const prompt = `
                Je bent een expert Schema Markup Validator.
                Analyseer de volgende structured data input (JSON-LD, Microdata, RDFa, of Code Fragment):
                
                INPUT START:
                ${input}
                INPUT END

                Taken:
                1. Detecteer formaten & types.
                2. Valideer strikt op schema.org.
                3. Bepaal Health Score (0-100).
                4. Genereer ALTIJD een verbeterde, complete JSON-LD versie als string.

                Output Taal: Nederlands.
            `;

            const response = await ai.models.generateContent({
                model: "gemini-2.5-flash",
                contents: prompt,
                config: {
                    responseMimeType: "application/json",
                    responseSchema: responseSchema,
                    temperature: 0.1,
                },
            });

            const text = response.text;
            if (!text) throw new Error("Geen antwoord van Gemini");

            const rawResult = JSON.parse(text);
            let correctedJsonLd = {};
            try {
                if (rawResult.correctedJsonLdString) {
                    correctedJsonLd = JSON.parse(rawResult.correctedJsonLdString);
                }
            } catch (e) {
                console.error("JSON Parse Error", e);
            }

            return { ...rawResult, correctedJsonLd };
        };

        // --- Components ---
        const ScoreGauge = ({ score }) => {
            const data = [{ name: 'Score', value: score }, { name: 'Remaining', value: 100 - score }];
            let color = '#ef4444';
            if (score >= 50) color = '#f59e0b';
            if (score >= 80) color = '#a855f7';

            return (
                <div className="relative h-48 w-48 mx-auto">
                    <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                            <Pie data={data} cx="50%" cy="50%" innerRadius={60} outerRadius={80} startAngle={180} endAngle={0} paddingAngle={0} dataKey="value" stroke="none">
                                <Cell key="score" fill={color} />
                                <Cell key="remaining" fill="#e2e8f0" />
                            </Pie>
                        </PieChart>
                    </ResponsiveContainer>
                    <div className="absolute inset-0 flex flex-col items-center justify-center pt-8">
                        <span className="text-4xl font-bold text-slate-800">{score}</span>
                        <span className="text-sm font-medium text-slate-500 uppercase tracking-wide">Score</span>
                    </div>
                </div>
            );
        };

        const ResultDashboard = ({ result }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => {
                navigator.clipboard.writeText(JSON.stringify(result.correctedJsonLd, null, 2));
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const isImprovement = (issue) => issue.severity === ValidationSeverity.Warning || issue.message.toLowerCase().includes('ontbreekt') || issue.message.toLowerCase().includes('aanbevolen');
            
            const getSeverityIcon = (issue) => {
                if (issue.severity === ValidationSeverity.Error) return <AlertCircle className="w-5 h-5 text-red-500" />;
                if (isImprovement(issue)) return <AlertTriangle className="w-5 h-5 text-amber-500" />;
                return <CheckCircle className="w-5 h-5 text-brand-500" />;
            };

            const getSeverityClass = (issue) => {
                if (issue.severity === ValidationSeverity.Error) return 'bg-red-50 border-red-100 text-red-900';
                if (isImprovement(issue)) return 'bg-[#fffbeb] border-[#fcd34d] text-[#92400e]';
                return 'bg-brand-50 border-brand-100 text-brand-900';
            };

            return (
                <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white rounded border border-slate-200 p-6 flex items-center justify-center md:col-span-1 shadow-sm">
                            <ScoreGauge score={result.healthScore} />
                        </div>
                        <div className="bg-white rounded border border-slate-200 p-6 md:col-span-2 flex flex-col justify-center shadow-sm">
                            <h2 className="text-lg font-semibold text-slate-900 mb-2 flex items-center gap-2">
                                <FileJson className="w-5 h-5 text-brand-600" /> Analyse Samenvatting
                            </h2>
                            <p className="text-slate-600 leading-relaxed">{result.summary}</p>
                            <div className="mt-4 flex flex-wrap gap-2">
                                {result.detectedTypes.map((type, idx) => (
                                    <span key={idx} className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-brand-100 text-brand-800 border border-brand-200">{type}</span>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded border border-slate-200 overflow-hidden shadow-sm">
                        <div className="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                            <h3 className="font-semibold text-slate-800">Validatie Rapport</h3>
                            <span className="text-xs font-medium bg-slate-200 text-slate-600 px-2 py-1 rounded-full">{result.issues.length} meldingen</span>
                        </div>
                        <div className="divide-y divide-slate-100">
                            {result.issues.length === 0 ? (
                                <div className="p-8 text-center text-slate-500"><CheckCircle className="w-12 h-12 text-brand-500 mx-auto mb-3" /><p className="font-medium">Geen problemen gevonden.</p></div>
                            ) : (
                                result.issues.map((issue, idx) => (
                                    <div key={idx} className={`p-4 flex gap-4 ${getSeverityClass(issue)} border-l-4 ${issue.severity === ValidationSeverity.Error ? 'border-l-red-500' : isImprovement(issue) ? 'border-l-[#f59e0b]' : 'border-l-brand-400'}`}>
                                        <div className="flex-shrink-0 mt-0.5">{getSeverityIcon(issue)}</div>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="uppercase text-[10px] font-bold tracking-wider opacity-80 border border-current px-1 rounded">{issue.type}</span>
                                                {issue.entity && <span className="text-xs font-semibold opacity-90">{issue.entity}</span>}
                                            </div>
                                            <p className="text-sm font-medium">{issue.message}</p>
                                            {issue.property && <p className="text-xs mt-1 opacity-75">Eigenschap: <code>{issue.property}</code></p>}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="bg-white rounded border border-slate-200 overflow-hidden shadow-sm">
                        <div className="p-4 border-b border-slate-100 bg-slate-50"><h3 className="font-semibold text-slate-800">Entiteit Details</h3></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
                            {result.entities.map((entity, idx) => (
                                <div key={idx} className="border border-slate-200 rounded p-4 hover:border-brand-300 transition-colors">
                                    <div className="flex items-center justify-between mb-3"><span className="font-bold text-slate-800">{entity.type}</span></div>
                                    <div className="space-y-3">
                                        {entity.missingRequired.length > 0 && (
                                            <div><span className="text-xs font-semibold text-red-600 block mb-1">Ontbrekend Verplicht</span><div className="flex flex-wrap gap-1">{entity.missingRequired.map(prop => <span key={prop} className="text-[10px] bg-red-50 text-red-700 px-1.5 py-0.5 rounded border border-red-100">{prop}</span>)}</div></div>
                                        )}
                                        {entity.missingRecommended.length > 0 && (
                                            <div><span className="text-xs font-semibold text-[#92400e] block mb-1">Aanbevolen</span><div className="flex flex-wrap gap-1">{entity.missingRecommended.map(prop => <span key={prop} className="text-[10px] bg-[#fffbeb] text-[#92400e] px-1.5 py-0.5 rounded border border-[#fcd34d]">{prop}</span>)}</div></div>
                                        )}
                                        <div><span className="text-xs font-semibold text-brand-600 block mb-1">Aanwezig</span><div className="flex flex-wrap gap-1">{entity.propertiesFound.slice(0, 5).map(prop => <span key={prop} className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">{prop}</span>)}{entity.propertiesFound.length > 5 && <span className="text-[10px] text-slate-400 pl-1">+{entity.propertiesFound.length - 5} meer</span>}</div></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="rounded shadow-lg overflow-hidden border border-slate-800 bg-[#0E172A]">
                        <div className="flex items-center justify-between px-4 py-3 bg-[#020617] border-b border-slate-800">
                            <div className="flex items-center gap-2"><Code className="w-4 h-4 text-brand-400" /><span className="text-sm font-medium text-slate-300">Gecorrigeerde JSON-LD</span></div>
                            <button onClick={handleCopy} className="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-slate-300 bg-transparent border border-slate-600 rounded hover:bg-slate-800 hover:border-slate-500 hover:text-white transition-all">
                                {copied ? <Check className="w-3.5 h-3.5 text-green-400" /> : <Copy className="w-3.5 h-3.5" />} {copied ? 'Gekopieerd!' : 'Kopieer'}
                            </button>
                        </div>
                        <div className="relative group bg-[#0E172A]">
                            <pre className="p-4 overflow-x-auto custom-scrollbar text-sm text-slate-300 font-mono leading-relaxed max-h-[500px] bg-[#0E172A]">{JSON.stringify(result.correctedJsonLd, null, 2)}</pre>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [input, setInput] = useState('');
            const [status, setStatus] = useState(AnalysisStatus.Idle);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const resultsRef = useRef(null);

            const handleAnalyze = async () => {
                if (!input.trim()) return;
                setStatus(AnalysisStatus.Loading);
                setError(null);
                setResult(null);
                try {
                    const data = await getSchemaAnalysis(input);
                    setResult(data);
                    setStatus(AnalysisStatus.Success);
                } catch (err) {
                    setError(err.message || "Er is iets misgegaan.");
                    setStatus(AnalysisStatus.Error);
                }
            };

            useEffect(() => {
                if (status === AnalysisStatus.Success && resultsRef.current) {
                    setTimeout(() => resultsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                }
            }, [status]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 font-sans text-slate-900">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-brand-500 rounded flex items-center justify-center shadow-sm"><Layout className="w-5 h-5 text-white" /></div>
                                <span className="font-bold text-lg tracking-tight text-slate-800">Schema Markup Validator</span>
                            </div>
                        </div>
                    </header>
                    <main className="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        <div className="text-center max-w-2xl mx-auto mb-10">
                            <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Structured Data Validatie</h1>
                            <p className="text-lg text-slate-600">Valideer, repareer en optimaliseer je schema markup voor betere SEO resultaten.</p>
                        </div>
                        <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden mb-8">
                            <div className="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <label className="text-sm font-semibold text-slate-800">Importeer Structured Data (Code of URL)</label>
                            </div>
                            <div className="p-6">
                                <textarea value={input} onChange={(e) => setInput(e.target.value)} placeholder="Plak hier je JSON-LD, Microdata of HTML..." className="w-full h-48 p-4 font-mono text-sm text-slate-800 bg-white border border-slate-300 rounded focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all resize-y placeholder:text-slate-400" />
                                <div className="mt-4 flex justify-end">
                                    <button onClick={handleAnalyze} disabled={status === AnalysisStatus.Loading || !input.trim()} className={`flex items-center justify-center px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 border-none ${status === AnalysisStatus.Loading || !input.trim() ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-[#FFC107] text-slate-900 hover:bg-[#E5AD06] hover:shadow-md hover:-translate-y-0.5'}`}>
                                        {status === AnalysisStatus.Loading ? <><Loader2 className="w-5 h-5 animate-spin mr-2" /> Analyseren...</> : "Analyseren"}
                                    </button>
                                </div>
                            </div>
                        </div>
                        {error && <div className="mb-8 p-4 bg-red-50 border border-red-200 rounded flex items-start gap-3 text-red-800 animate-in fade-in slide-in-from-top-2"><AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" /><div><h4 className="font-semibold">Analyse Mislukt</h4><p className="text-sm opacity-90">{error}</p></div></div>}
                        <div ref={resultsRef}>{result && status === AnalysisStatus.Success && <ResultDashboard result={result} />}</div>
                        {status === AnalysisStatus.Idle && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-slate-500 mt-12">
                                <div className="p-6 rounded border border-dashed border-slate-300 bg-white text-center">
                                    <div className="w-10 h-10 mx-auto bg-brand-50 rounded-full flex items-center justify-center mb-3"><span className="font-bold text-brand-600">1</span></div>
                                    <h3 className="font-medium text-slate-900 mb-1">Detectie</h3>
                                    <p className="text-sm">Herkent automatisch JSON-LD, RDFa en Microdata.</p>
                                </div>
                                <div className="p-6 rounded border border-dashed border-slate-300 bg-white text-center">
                                    <div className="w-10 h-10 mx-auto bg-brand-50 rounded-full flex items-center justify-center mb-3"><span className="font-bold text-brand-600">2</span></div>
                                    <h3 className="font-medium text-slate-900 mb-1">Validatie</h3>
                                    <p className="text-sm">Controleert strikt volgens de Schema.org standaarden.</p>
                                </div>
                                <div className="p-6 rounded border border-dashed border-slate-300 bg-white text-center">
                                    <div className="w-10 h-10 mx-auto bg-brand-50 rounded-full flex items-center justify-center mb-3"><span className="font-bold text-brand-600">3</span></div>
                                    <h3 className="font-medium text-slate-900 mb-1">Reparatie</h3>
                                    <p className="text-sm">Genereert direct bruikbare en foutloze code.</p>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="bg-white border-t border-slate-200 py-8 mt-12">
                        <div className="max-w-6xl mx-auto px-4 text-center text-slate-400 text-sm"><p>© {new Date().getFullYear()} Schema Markup Validator. Powered by Gemini 2.5 Flash.</p></div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
